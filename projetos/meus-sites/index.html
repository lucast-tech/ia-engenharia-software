<!-- Meus Sites: página simples com a lista dos sites que criei (Wix).
     Cada cartão tem um botão para abrir o site e outro para voltar ao lucast.tech.
     Para adicionar um site novo, copie um bloco .site-box e troque título e link. -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meus Sites</title>
  <!-- Estilos da página -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    /* Cartão de cada site */
    .site-box {
      background: #fff;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .site-box h2 {
      font-size: 16px;
      margin-bottom: 10px;
      color: #222;
    }

    /* Botões (azul = abrir, verde = voltar) */
    .button {
      display: inline-block;
      margin: 8px 5px;
      padding: 10px 16px;
      font-size: 14px;
      border-radius: 5px;
      color: white;
      text-decoration: none;
      transition: 0.2s;
    }

    .button:hover {
      opacity: 0.9;
    }

    .abrir {
      background: #007bff;
    }

    .voltar {
      background: #28a745;
    }
  </style>
</head>
<body>
  <!-- Lista de sites -->
  <div class="container">
    <h1>Meus Sites</h1>

    <div class="site-box">
      <h2>Venda de Sensibilidade Console</h2>
      <a href="https://lucastc007.wixsite.com/meusite" class="button abrir" target="_blank">Abrir Site</a>
      <a href="https://www.lucast.tech" class="button voltar" target="_blank">Voltar</a>
    </div>

    <div class="site-box">
      <h2>Homenagem ao Augusto</h2>
      <a href="https://lucastc007.wixsite.com/my-site-3" class="button abrir" target="_blank">Abrir Site</a>
      <a href="https://www.lucast.tech" class="button voltar" target="_blank">Voltar</a>
    </div>

    <div class="site-box">
      <h2>Sobre Lucas Torres Costa</h2>
      <a href="https://lucastc007.wixsite.com/website-2" class="button abrir" target="_blank">Abrir Site</a>
      <a href="https://www.lucast.tech" class="button voltar" target="_blank">Voltar</a>
    </div>

    <div class="site-box">
      <h2>Minha Vida – Blog Pessoal</h2>
      <a href="https://lucastc007.wixsite.com/minhavida" class="button abrir" target="_blank">Abrir Site</a>
      <a href="https://www.lucast.tech" class="button voltar" target="_blank">Voltar</a>
    </div>

    <div class="site-box">
      <h2>LSTC – Página Oficial</h2>
      <a href="https://lucastc007.wixsite.com/website" class="button abrir" target="_blank">Abrir Site</a>
      <a href="https://www.lucast.tech" class="button voltar" target="_blank">Voltar</a>
    </div>

    <div class="site-box">
      <h2>Top Músicas & Rock</h2>
      <a href="https://lucastc007.wixsite.com/my-site" class="button abrir" target="_blank">Abrir Site</a>
      <a href="https://www.lucast.tech" class="button voltar" target="_blank">Voltar</a>
    </div>
  </div>
</body>
</html>
