<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">
  <title>Página não encontrada | Fabi Marques</title>
  <link rel="icon" type="image/png" href="/assets/img/favicon.png">
  <script>try{var t=localStorage.getItem('tema');if(t==='claro'||t==='escuro')document.documentElement.setAttribute('data-tema',t)}catch(e){}</script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <header class="page-head" data-mark="404">
      <p class="crumb">/404</p>
      <h1>Página não encontrada</h1>
      <p>O endereço pode ter mudado. Volte para o início ou escolha uma página.</p>
    </header>
    <div class="actions" style="margin-top:24px">
      <a class="btn btn-primary" href="/">Ir para o início</a>
      <a class="btn btn-line" href="/cursos/">Ver os cursos</a>
      <a class="btn btn-line" href="/contato/">Contato</a>
    </div>
  </main>
</body>
</html>
